<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIGNA – Posture App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, premium wearable-wellness; clinical precision on the technical screen
   IDEA: a wearable companion app – the phone itself is the page
   PICTURE: a live, animated seated figure (side + back) whose spine bends with the IMU
   COLOUR & TYPE: deep teal-navy night, electric mint for "aligned", amber/coral for deviation; Sora + JetBrains Mono
   LAYOUT: desktop = phone on a stage beside a live pipeline/demo console; mobile = full-screen app */
:root{color-scheme:dark;--page:#04110F;--bg:#071A1F;--card:#0C252C;--card2:#11313A;--line:rgba(150,235,220,.10);--line2:rgba(150,235,220,.18);
--ink:#E9F7F4;--mute:#8EB2AF;--dim:#5E807D;--mint:#3CF2B4;--teal:#18C3B0;--amber:#FFB547;--orange:#FF8A5B;--coral:#FF6B7A;--sky:#7CB8FF;--violet:#B69CFF}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 70% 20%,#0B2B2C 0,transparent 60%),radial-gradient(900px 600px at 10% 90%,#0A2030 0,transparent 60%),var(--page);color:var(--ink);font:15px/1.5 Sora,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
/* stage */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:center;padding:20px 48px;max-width:1360px;margin:0 auto}
.side{max-height:calc(100vh - 40px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.phoneWrap{position:relative}
.phone{position:absolute;top:0;left:0;width:390px;height:844px;transform-origin:0 0;border-radius:54px;background:var(--bg);box-shadow:0 0 0 11px #0d1416,0 0 0 12px #2a3638,0 40px 120px rgba(0,0,0,.6),0 0 140px rgba(60,242,180,.08);overflow:hidden;display:flex;flex-direction:column}
.phone.shake{animation:shake .5s}
@keyframes shake{0%,100%{translate:0}20%{translate:-3px 0}40%{translate:3px 0}60%{translate:-2px 0}80%{translate:2px 0}}
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:118px;height:34px;border-radius:20px;background:#000;z-index:60}
.statusbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 34px;font-size:14px;font-weight:600;z-index:5}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 110px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.enter{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:860px){.overlay{padding-top:0}body{overflow:auto}.stage{display:block;padding:0}.side{display:none}.phoneWrap{width:100%!important;height:100dvh!important}.phone{position:relative;width:100%;height:100dvh;transform:none!important;border-radius:0;box-shadow:none}.island{display:none}.statusbar{display:none}.screen{padding-top:14px}}

.nav{position:absolute;left:12px;right:12px;bottom:14px;height:68px;border-radius:26px;background:rgba(10,32,38,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--dim);font-weight:500;position:relative;transition:color .2s}
.nav button.on{color:var(--mint)}
.nav button.on::before{content:"";position:absolute;top:7px;width:38px;height:30px;border-radius:12px;background:rgba(60,242,180,.12)}
.nav svg{position:relative}
/* generic */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0}
.h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--mute);font-size:13px}
.tiny{font-size:11.5px;color:var(--dim)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;position:relative}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;font-weight:500;white-space:nowrap}
.demoPill{background:repeating-linear-gradient(135deg,rgba(255,181,71,.20) 0 6px,rgba(255,181,71,.08) 6px 12px);border-color:rgba(255,181,71,.5);color:var(--amber);font-weight:700;letter-spacing:.02em}
.btn{height:46px;padding:0 18px;border-radius:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line2);transition:transform .15s,background .2s}

.btn.pri{background:linear-gradient(135deg,var(--mint),var(--teal));color:#03221C;border:0;box-shadow:0 8px 24px rgba(60,242,180,.25)}
.btn.warn{color:var(--coral);border-color:rgba(255,107,122,.35)}
.btn.sm{height:38px;padding:0 13px;border-radius:13px;font-size:13px}
.btn.full{width:100%}

.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:3px}

.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mute)}
.lbl{font-size:12px;color:var(--mute);font-weight:500}
/* home */
.posLabel{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.05;transition:color .4s}
.hero{padding:10px 8px 8px;overflow:hidden}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fig{border-radius:18px;padding:6px 4px 2px;transition:background .3s,box-shadow .3s;position:relative}
.fig.act{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line2)}

.figcap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);padding:0 8px 4px}

.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}

.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.gauge{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.07);margin:10px 0 4px}
.gauge .z{position:absolute;top:0;bottom:0;border-radius:6px;background:rgba(60,242,180,.18)}
.gauge .k{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--ink);transition:left .25s;box-shadow:0 0 10px currentColor}
.gauge .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.nudge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.25);margin-top:12px;font-size:13px}
.pulseDot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pd 1.8s infinite}
@keyframes pd{0%{box-shadow:0 0 0 0 rgba(60,242,180,.5)}100%{box-shadow:0 0 0 10px rgba(60,242,180,0)}}
/* live */
.hatch{background:repeating-linear-gradient(135deg,rgba(255,181,71,.16) 0 8px,rgba(255,181,71,.05) 8px 16px);border:1px solid rgba(255,181,71,.45);color:#FFD59A;border-radius:16px;padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.hatch.hw{background:rgba(60,242,180,.08);border-color:rgba(60,242,180,.4);color:var(--mint)}
.chan{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.chan .n{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:5px}
.chan .n i{width:7px;height:7px;border-radius:2px;display:inline-block}
.chan .v{font-size:16px;margin-top:2px}
.chart{position:relative;height:130px;margin-top:8px}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:3px;border-radius:2px;display:inline-block}
.pipe{display:flex;gap:4px;align-items:stretch;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pipe div{flex:none;padding:7px 9px;border-radius:11px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:11px;line-height:1.3}
.pipe div b{display:block;font-size:11.5px}
.pipe .ar{background:none;border:0;padding:0 1px;display:grid;place-items:center;color:var(--dim)}
/* session */
.tl{position:relative;height:34px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05);display:flex}
.tl i{height:100%;display:block}
.hrow{display:grid;grid-template-columns:112px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.hrow .t{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
/* trends */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bars .col{flex:1;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;height:100%;justify-content:flex-start;cursor:pointer;opacity:.85;transition:opacity .2s}
.bars .col.sel{opacity:1;outline:1px solid var(--line2);outline-offset:2px}
.xl{display:flex;gap:5px;margin-top:6px}.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--dim);overflow:hidden;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--mute);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
/* device & forms */
.list>div{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:10px}
.list>div:last-child{border-bottom:0}
.list .k{color:var(--mute)}
.list .val{text-align:right;font-weight:500}
.tog{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--mint)}.tog.on::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--mint);height:28px}
input[type=text]{width:100%;height:46px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--ink);font:16px Sora,sans-serif;padding:0 14px}
.setrow{padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
details{font-size:13px;color:var(--mute)}
details summary{cursor:pointer;color:var(--ink);font-weight:600;padding:4px 0;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details code{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mint);overflow-wrap:anywhere}
details pre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px;font:11px/1.5 "JetBrains Mono",monospace;color:#bfe;overflow-x:auto}
/* overlays */
.overlay{position:absolute;inset:0;padding-top:50px;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:enter .35s}
.sheetBg{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:46;background:#0E2A31;border-radius:30px 30px 0 0;border-top:1px solid var(--line2);padding:10px 18px 26px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pbtn{border-radius:16px;padding:10px 6px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:76px}
.pbtn.on{border-color:currentColor;background:rgba(255,255,255,.09)}
.toasts{position:absolute;top:58px;left:14px;right:14px;z-index:70;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(14,42,49,.94);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:18px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:center;animation:tin .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:7px;height:7px;border-radius:4px;background:var(--line2);transition:all .3s}.dots i.on{width:22px;background:var(--mint)}
.steps{display:flex;gap:6px;margin:6px 0 16px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line2);transition:background .3s}.steps i.on{background:var(--mint)}
/* side console */
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-size:40px;letter-spacing:.06em;margin:0;font-weight:600;line-height:1}
.tag{color:var(--mute);font-size:15px;margin:6px 0 0}
.pn{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);margin-bottom:6px;transition:border-color .3s,background .3s}
.pn.hot{border-color:rgba(60,242,180,.45);background:rgba(60,242,180,.06)}
.pn .ix{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(60,242,180,.1);color:var(--mint);font-size:12px;font-weight:600}
.pn b{font-size:13.5px;font-weight:600;display:block}
.pn span{font-size:12px;color:var(--mute)}
.pn .vv{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink);text-align:right;white-space:nowrap}
.sideBtns{display:flex;flex-wrap:wrap;gap:6px}
.sideBtns button{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:12.5px;font-weight:500}
.sideBtns button.on{background:rgba(60,242,180,.14);border-color:var(--mint);color:var(--mint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
{
/* =====================================================================
   ALIGNA – architecture (single file, layered so the ESP32 can drop in)
   1. Data sources     SimulatedImuSource | Esp32BleSource | Esp32WifiSource
   2. Processing       PostureEstimator (calibration + complementary filter)
   3. Classification   ThresholdClassifier (ML model can replace .classify)
   4. Feedback         FeedbackController (sustained-posture → haptic)
   5. Session          SessionTracker (durations, events, timeline)
   6. Store            Engine (wires 1–5, exposes state to UI)
   7. UI               React components (read-only view of the store)
   ===================================================================== */
const {useState,useEffect,useRef,useSyncExternalStore,useMemo,useCallback} = React;
const html = htm.bind(React.createElement);
const D2R = Math.PI/180, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const noise=()=>(Math.random()+Math.random()+Math.random()-1.5)*0.9;
const smooth01=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const store={get:(k,d)=>{try{const v=localStorage.getItem('aligna.'+k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('aligna.'+k,JSON.stringify(v))}catch(e){}}};

const POSTURES={
  upright:{label:'Upright',head:'Aligned',color:'#3CF2B4',kind:'good',msg:'Great! Your posture is aligned.'},
  slouch:{label:'Forward slouch',head:'Slouching',color:'#FFB547',kind:'poor',msg:'Your upper body is leaning forward.'},
  left:{label:'Left lean',head:'Leaning left',color:'#FF8A5B',kind:'poor',msg:'You are leaning to the left. Re-centre your shoulders.'},
  right:{label:'Right lean',head:'Leaning right',color:'#FF8A5B',kind:'poor',msg:'You are leaning to the right. Re-centre your shoulders.'},
  bend:{label:'Forward bending',head:'Bending forward',color:'#FF6B7A',kind:'poor',msg:'Deep forward bend. Hinge at the hips and keep your back long.'},
  moving:{label:'Moving',head:'On the move',color:'#7CB8FF',kind:'active',msg:'Movement detected. Scoring pauses while you move.'}
};
const PKEYS=Object.keys(POSTURES);
const SENS={relaxed:{slouch:15,lean:12,bend:40},balanced:{slouch:12,lean:10,bend:35},strict:{slouch:9,lean:7,bend:30}};

/* ---------- 1a. Simulated IMU (MPU6050-like, 50 Hz) ----------
   Axis convention (assumed, confirm against the real mounting):
   X → wearer's right, Y → up along the spine, Z → out of the back.
   Upright: a ≈ (0, +1 g, 0). Forward tilt rotates about X, lateral about Z. */
class SimulatedImuSource{
  constructor(){this.kind='simulated';this.label='Simulated IMU';this.rate=50;this.mode='auto';this.state='upright';this.t=0;
    this.mount={p:5,r:2.2};this.p=this.mount.p;this.r=this.mount.r;this.prevP=this.p;this.prevR=this.r;this.target={p:0,r:0};this.dwell=7;this.timer=null}
  setMode(m){this.mode=m;if(m==='auto')this.dwell=0.5;else this.enter(m)}
  enter(st){this.state=st;const T={upright:[rnd(-1.2,1.2),rnd(-1.2,1.2)],slouch:[rnd(16,22),rnd(-2,2)],left:[rnd(2,5),-rnd(13,18)],right:[rnd(2,5),rnd(13,18)],bend:[rnd(44,56),rnd(-3,3)],moving:[8,0]}[st];
    this.target={p:T[0],r:T[1]};this.dwell={upright:rnd(7,14),slouch:rnd(10,20),left:rnd(6,11),right:rnd(6,11),bend:rnd(4,7),moving:rnd(4,7)}[st]}
  pickNext(){if(this.state!=='upright')return Math.random()<.85?'upright':'slouch';const w=[['slouch',45],['left',15],['right',15],['bend',12],['moving',13]];let x=Math.random()*100;for(const[k,v]of w){if((x-=v)<0)return k}return'slouch'}
  start(cb){this.cb=cb;const dt=1/this.rate;this.timer=setInterval(()=>this.step(dt),1000/this.rate);return Promise.resolve()}
  stop(){clearInterval(this.timer);this.timer=null}
  step(dt){
    this.t+=dt;
    if(this.mode==='auto'){this.dwell-=dt;if(this.dwell<=0)this.enter(this.pickNext())}
    const mv=this.state==='moving',tau=mv?.25:.75,k=1-Math.exp(-dt/tau);
    let tp=this.target.p,tr=this.target.r;
    if(mv){tp=10+16*Math.sin(this.t*4.4)+5*Math.sin(this.t*11);tr=9*Math.sin(this.t*2.8+1)}
    tp+=.8*Math.sin(this.t*.13);
    this.p+=(this.mount.p+tp-this.p)*k;this.r+=(this.mount.r+tr-this.r)*k;
    const P=this.p+.5*Math.sin(this.t*1.57),R=this.r;

function useCanvas(draw){const ref=useRef(null);useEffect(()=>{let raf;const loop=()=>{const c=ref.current;if(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);draw(x,w,h)}raf=requestAnimationFrame(loop)};loop();return()=>cancelAnimationFrame(raf)},[draw]);return ref}
function makeDraw(keys,colors,win,fixed,bands){return(x,w,h)=>{
  const b=S.buf,n=Math.min(b.n,Math.round(win*50));const padL=34,padB=16,pw=w-padL-4,ph=h-padB-6;
  const get=(k,i)=>b.ch[k][(b.head-n+i+BUFN)%BUFN];
  let mn=fixed?fixed[0]:Infinity,mx=fixed?fixed[1]:-Infinity;
  if(!fixed){for(const k of keys)for(let i=0;i<n;i++){const v=get(k,i);if(v<mn)mn=v;if(v>mx)mx=v}if(!isFinite(mn)){mn=-1;mx=1}const pad=Math.max(.05,(mx-mn)*.15);mn-=pad;mx+=pad}
  const Y=v=>6+ph-(v-mn)/(mx-mn)*ph;
  x.font='10px JetBrains Mono, monospace';x.fillStyle='rgba(142,178,175,.8)';x.strokeStyle='rgba(150,235,220,.08)';x.lineWidth=1;
  for(let j=0;j<=3;j++){const v=mn+(mx-mn)*j/3,y=Y(v);x.beginPath();x.moveTo(padL,y);x.lineTo(w-4,y);x.stroke();x.fillText(Math.abs(v)>=10?v.toFixed(0):v.toFixed(1),2,y+3)}
  for(let s=0;s<=win;s+=win>6?2:1){const xx=padL+pw*(1-s/win);x.fillText(s?`-${s}s`:'now',xx-(s?12:20),h-3)}
  if(bands)for(const[v,c]of bands){x.strokeStyle=c;x.setLineDash([4,4]);x.beginPath();x.moveTo(padL,Y(v));x.lineTo(w-4,Y(v));x.stroke();x.setLineDash([])}
  const off=Math.round(win*50)-n;
  keys.forEach((k,ki)=>{x.strokeStyle=colors[ki];x.lineWidth=1.6;x.beginPath();for(let i=0;i<n;i++){const xx=padL+pw*(off+i)/(win*50),y=Y(get(k,i));i?x.lineTo(xx,y):x.moveTo(xx,y)}x.stroke()})
}}
function Chart({keys,colors,win,fixed,bands,h=130}){const draw=useMemo(()=>makeDraw(keys,colors,win,fixed,bands),[win,JSON.stringify(bands)]);const ref=useCanvas(draw);
  return html`<div className="chart" style=${{height:h}}><canvas ref=${ref}></canvas></div>`}

function prng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(view){const R=prng(view==='day'?11:view==='week'?22:33);
  const labels=view==='day'?['8a','9a','10a','11a','12p','1p','2p','3p','4p','5p','6p','7p']:view==='week'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:Array.from({length:30},(_,i)=>String(i+1));
  const n=labels.length,score=[],good=[],poor=[],slouch=[];
  for(let i=0;i<n;i++){const trend=view==='month'?i*.45:view==='week'?i*1.3:(i>5&&i<9?-8:0);const s=clamp(64+trend+R()*14-(view==='day'&&i>8?6:0),40,96);score.push(Math.round(s));
    const tot=view==='day'?50+R()*10:240+R()*140;good.push(Math.round(tot*s/100));poor.push(Math.round(tot*(1-s/100)));slouch.push(Math.round((100-s)/(view==='day'?6:2.2)+R()*3))}
  const sum=a=>a.reduce((x,y)=>x+y,0),G=sum(good),Pm=sum(poor);
  const dist={upright:G,slouch:Pm*.52,left:Pm*.17,right:Pm*.21,bend:Pm*.10,moving:(G+Pm)*.12};
  return{labels,score,good,poor,slouch,dist,left:Math.round(sum(slouch)*.33),right:Math.round(sum(slouch)*.41),avg:Math.round(sum(score)/n),prevAvg:Math.round(sum(score)/n-(view==='month'?5:view==='week'?3:-2)),G,Pm}}
function useWidth(){const ref=useRef(null);const[w,setW]=useState(320);useEffect(()=>{const el=ref.current;if(!el)return;const ro=new ResizeObserver(()=>setW(el.clientWidth));ro.observe(el);setW(el.clientWidth);return()=>ro.disconnect()},[]);return[ref,w]}

    <line x1=${X(s)} x2=${X(s)} y1=${pt} y2=${H-pb} stroke="rgba(233,247,244,.25)"/><circle cx=${X(s)} cy=${Y(values[s])} r="5" fill="#071A1F" stroke="#3CF2B4" strokeWidth="2.2"/></svg>

      <span className="chip" style=${{color:S.calib.done?'#3CF2B4':'#FFB547'}}>${S.calib.done?'Calibrated':'Required'}</span></div>

      <p>The app reads sensor data through a <code>source</code> interface. Today the <code>SimulatedImuSource</code> is active; <code>Esp32BleSource</code> and <code>Esp32WifiSource</code> are prepared but no protocol is finalised.</p>

      <pre>ax ay az gx gy gz   int16 LE × 6
BLE_CONFIG.serviceUuid = "…"  // set from firmware
BLE_CONFIG.charUuid    = "…"</pre>
      <p><b style=${{color:'var(--ink)'}}>Where it can run:</b> Web Bluetooth works in Chrome on Android, Windows, macOS and ChromeOS over HTTPS. It is not available in iOS Safari, and this preview frame blocks device access and outside connections, so the hardware button reports why it cannot connect rather than pretending to.</p>

/* ---------------- CALIBRATION FLOW ---------------- */
function Calibration({close}){
  useTick();const[step,setStep]=useState(0);const[left,setLeft]=useState(5);const[res,setRes]=useState(null);const timer=useRef(null);
  const on=S.link.status==='streaming';
  const[prep,setPrep]=useState(0);const sayP=t=>{if(S.link.kind==='phone')speak(t);else if(S.link.kind==='remote'&&source&&source.send)source.send({k:'say',text:t})};
  const begin=()=>{if(!on){toast('Connect a data source first','#FF6B7A','x');return}
    if(S.link.kind==='phone'&&S.settings.phoneMount==='back'){setStep(3);setPrep(10);speak('Put the phone on your back and sit tall.');const t0=performance.now();
      timer.current=setInterval(()=>{const r=10-(performance.now()-t0)/1000;setPrep(Math.max(0,r));if(r<=0){clearInterval(timer.current);setPrep(0);speak('Hold still.');capture()}},100);return}
    sayP('Sit tall and hold still.');capture()};
  const capture=()=>{
    if(S.link.kind==='simulated'){S._prevMode=sim.mode;sim.setMode('upright')}
    S.calibCollect=[];setStep(3);setLeft(5);const t0=performance.now();
    timer.current=setInterval(()=>{const e=(performance.now()-t0)/1000;setLeft(Math.max(0,5-e));if(e>=5){clearInterval(timer.current);finish()}},50)};
  const finish=()=>{const c=S.calibCollect||[];S.calibCollect=null;if(S.link.kind==='simulated')sim.setMode(S._prevMode||'auto');
    const tail=c.slice(Math.floor(c.length*.3));if(tail.length<20){setRes({ok:false,why:'Not enough samples received.'});sayP('Calibration failed.');setStep(4);return}
    const m=k=>tail.reduce((a,x)=>a+x[k],0)/tail.length,sd=k=>{const mu=m(k);return Math.sqrt(tail.reduce((a,x)=>a+(x[k]-mu)**2,0)/tail.length)};
    const p=m('p'),r=m('r'),sp=sd('p'),sr=sd('r'),g=m('g');
    if(sp>1.5||sr>1.5||g>15){sayP('Too much movement. Try again.');setRes({ok:false,why:`Too much movement (σ ${Math.max(sp,sr).toFixed(1)}°). Hold still and try again.`});setStep(4);return}
    S.calib={done:true,p,r,at:Date.now()};store.set('calib',S.calib);setRes({ok:true,p,r,sp:Math.max(sp,sr),n:tail.length});setStep(4);toast('Neutral posture saved');sayP('Calibration saved.')};
  useEffect(()=>()=>{clearInterval(timer.current);if(S.calibCollect){S.calibCollect=null;if(S.link.kind==='simulated')sim.setMode(S._prevMode||'auto')}},[]);
  const L=S.live,C=2*Math.PI*70;
  const steps=[['Wear the device','Strap the sensor on your upper back, centred on the spine, with the switch facing out and the strap snug.'],
    ['Sit or stand tall','Settle into a comfortable upright position: shoulders relaxed, eyes level, feet flat.'],
    ['Ready to calibrate','Press Calibrate and hold still for 5 seconds. ALIGNA records this as your neutral orientation.']];
  return html`<div className="overlay"><div className="screen" style=${{paddingBottom:30}}>
    <div className="hdr"><button className="iconbtn" onClick=${close} aria-label="Close"><${Icon} n="x" s=${18}/></button><b>Calibration</b><span style=${{width:42}}></span></div>
    <div className="steps">${[0,1,2,3,4].map(i=>html`<i key=${i} className=${i<=step?'on':''}></i>`)}</div>
    ${step<3&&html`<div className="enter" key=${step}>
      <div className="card" style=${{display:'grid',placeItems:'center',padding:'10px 0'}}><div style=${{width:220}}>${step===0?html`<${SideFigure} P=${0} color="#3CF2B4" haptic=${true} uid="c0"/>`:html`<${SideFigure} P=${on?L.p:0} color=${Math.abs(L.p)<6?'#3CF2B4':'#FFB547'} uid="c1"/>`}</div></div>
      <div className="lbl">Step ${step+1} of 5</div><h2 className="h1" style=${{margin:'4px 0 8px'}}>${steps[step][0]}</h2><p className="sub" style=${{fontSize:15,color:'var(--ink)',opacity:.85}}>${steps[step][1]}</p>
      ${step>0&&html`<div className="grid2" style=${{margin:'14px 0'}}><div className="chan"><div className="n">Raw tilt (uncorrected)</div><div className="v mono">${fmtA(L.pAbs)}</div></div><div className="chan"><div className="n">Raw lateral</div><div className="v mono">${fmtA(L.rAbs)}</div></div></div>`}
      ${S.link.kind==='simulated'&&step===2&&html`<div className="tiny" style=${{marginBottom:12,color:'#FFB547'}}>Demo: the simulated wearer will sit upright during capture.</div>`}
      <button className="btn pri full" style=${{marginTop:8}} onClick=${()=>step<2?setStep(step+1):begin()}>${step<2?'Continue':'Calibrate'}</button></div>`}
    ${step===3&&html`<div className="enter" style=${{textAlign:'center'}}>
      <div style=${{display:'grid',placeItems:'center',margin:'20px 0'}}><div style=${{position:'relative',width:170,height:170}}>
        <svg width="170" height="170" style=${{transform:'rotate(-90deg)'}}><circle cx="85" cy="85" r="70" fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="10"/>
        <circle cx="85" cy="85" r="70" fill="none" stroke="#3CF2B4" strokeWidth="10" strokeLinecap="round" strokeDasharray=${C} strokeDashoffset=${C*left/5} style=${{filter:'drop-shadow(0 0 8px #3CF2B488)'}}/></svg>
        <div style=${{position:'absolute',inset:0,display:'grid',placeItems:'center'}}><div><div className="num" style=${{fontSize:48,fontWeight:600}}>${Math.ceil(prep>0?prep:left)}</div><div className="tiny">${prep>0?'get ready':'hold still'}</div></div></div></div></div>
      <h2 className="h1">${prep>0?`Get into position · ${Math.ceil(prep)} s`:'Capturing neutral…'}</h2><p className="sub">Step 4 of 5 · ${(S.calibCollect||[]).length} samples</p>
      <div className="card" style=${{textAlign:'left'}}><div className="row between" style=${{fontSize:13}}><span>Stability</span><b>${L.gyroMag<8?'Steady':'Moving'}</b></div><div className="bar" style=${{marginTop:8}}><i style=${{width:clamp(100-L.gyroMag*4,5,100)+'%',background:L.gyroMag<8?'#3CF2B4':'#FFB547'}}></i></div></div></div>`}
    ${step===4&&res&&html`<div className="enter" style=${{textAlign:'center'}}>
      <div style=${{width:88,height:88,borderRadius:44,margin:'24px auto 14px',display:'grid',placeItems:'center',background:res.ok?'rgba(60,242,180,.14)':'rgba(255,107,122,.14)',color:res.ok?'#3CF2B4':'#FF6B7A'}}><${Icon} n=${res.ok?'check':'x'} s=${40} w=${2.2}/></div>
      <div className="lbl">Step 5 of 5</div><h2 className="h1">${res.ok?'Neutral saved':'Calibration failed'}</h2>
      <p className="sub" style=${{fontSize:15}}>${res.ok?'Angles are now measured relative to this position.':res.why}</p>
      ${res.ok&&html`<div className="card list" style=${{textAlign:'left'}}><div><span className="k">Tilt offset</span><span className="val mono">${fmtA(res.p)}</span></div><div><span className="k">Lateral offset</span><span className="val mono">${fmtA(res.r)}</span></div><div><span className="k">Stability (σ)</span><span className="val mono">${res.sp.toFixed(2)}°</span></div><div><span className="k">Samples used</span><span className="val mono">${res.n}</span></div></div>`}
      <div className="row" style=${{gap:8,marginTop:10}}><button className="btn" style=${{flex:1}} onClick=${()=>{setStep(2);setRes(null)}}>Redo</button><button className="btn pri" style=${{flex:1}} onClick=${close}>Done</button></div></div>`}
  </div></div>`}

/* ---------------- LABELLED EVALUATION ---------------- */
function Evaluation({close}){useTick();const[hold,setHold]=useState(20);const[reps,setReps]=useState(2);const[quiet,setQuiet]=useState(true);
  const E=S.ev,on=S.link.status==='streaming',res=E&&!E.running?E.res:null,L=S.live,pct=v=>v==null?'–':(v*100).toFixed(0)+'%';
  const total=EVAL_PROTO.length*reps*hold;
  return html`<div className="overlay"><div className="screen" style=${{paddingBottom:30}}>
    <div className="hdr"><button className="iconbtn" onClick=${()=>{if(E&&E.running)finishEval(true);close()}} aria-label="Close"><${Icon} n="x" s=${18}/></button><b>Labelled evaluation</b><span style=${{width:42}}></span></div>
    ${(!E||(!E.running&&!res))&&html`<div className="enter">
      <p className="sub" style=${{fontSize:14,color:'var(--ink)',opacity:.85}}>The wearer follows spoken prompts through a fixed posture script. Each prompt is the ground-truth label; ALIGNA's live classification is compared with it.</p>
      ${!S.calib.done&&html`<div className="hatch"><${Icon} n="target" s=${18}/><span>Calibrate first, so angles are relative to the wearer's neutral posture.</span></div>`}
      ${S.link.kind==='simulated'&&html`<div className="hatch"><${Icon} n="flask" s=${18}/><span>The demo source is active. Results would describe the simulator, not a person. Link the iPhone for real results.</span></div>`}
      <div className="card"><div className="lbl">Script (repeated)</div><div style=${{display:'flex',flexWrap:'wrap',gap:6,marginTop:8}}>${EVAL_PROTO.map((k,i)=>html`<span key=${i} className="chip" style=${{color:POSTURES[k].color}}>${POSTURES[k].label}</span>`)}</div></div>
      <div className="card"><div className="setrow"><div style=${{fontSize:14,marginBottom:8}}>Hold each posture</div><div className="seg">${[10,20,30].map(v=>html`<button key=${v} className=${hold===v?'on':''} onClick=${()=>setHold(v)}>${v} s</button>`)}</div></div>
        <div className="setrow"><div style=${{fontSize:14,marginBottom:8}}>Repetitions</div><div className="seg">${[1,2,3].map(v=>html`<button key=${v} className=${reps===v?'on':''} onClick=${()=>setReps(v)}>${v}×</button>`)}</div></div>
        <div className="setrow row between"><span style=${{fontSize:14}}>Pause nudges during the test</span><button className=${'tog'+(quiet?' on':'')} role="switch" aria-checked=${quiet} aria-label="Pause nudges" onClick=${()=>setQuiet(!quiet)}></button></div>
        <div className="tiny">Total ${fmtT(total)}. The first 3 s after each prompt are treated as transition and not scored.</div></div>
      <button className="btn pri full" disabled=${!on} onClick=${()=>startEval(hold,reps,quiet)}><${Icon} n="play" s=${18}/>Start evaluation</button></div>`}
    ${E&&E.running&&(()=>{const idx=Math.max(0,E.idx),y=E.steps[idx],ts=E.t-idx*E.hold,nx=E.steps[idx+1];return html`<div className="enter" style=${{textAlign:'center'}}>
      <div className="lbl" style=${{marginTop:10}}>Step ${idx+1} of ${E.steps.length} · ${ts<E.gap?'transition (not scored)':'scoring'}</div>
      <div className="posLabel" style=${{color:POSTURES[y].color,fontSize:36,margin:'8px 0'}}>${POSTURES[y].label}</div>
      <p className="sub" style=${{fontSize:15}}>${EVAL_TXT[y]}</p>
      <div className="bar" style=${{height:10,margin:'16px 0 6px'}}><i style=${{width:Math.min(100,ts/E.hold*100)+'%',background:POSTURES[y].color}}></i></div>
      <div className="row between tiny"><span>${Math.ceil(E.hold-ts)} s left</span><span>${nx?'Next: '+POSTURES[nx].label:'Last step'}</span></div>
      <div className="card" style=${{marginTop:16,textAlign:'left'}}><div className="row between"><span className="lbl">ALIGNA predicts</span><b style=${{color:POSTURES[L.cls].color}}>${POSTURES[L.cls].label}</b></div>
        <div className="row between tiny" style=${{marginTop:6}}><span>tilt ${fmtA(L.p)} · lateral ${fmtA(L.r)}</span><span>${L.cls===y?'match':'mismatch'}</span></div></div>
      <div className="bar" style=${{height:6,marginTop:6}}><i style=${{width:E.t/(E.steps.length*E.hold)*100+'%',background:'#18C3B0'}}></i></div>
      <div className="tiny" style=${{marginTop:4}}>Overall ${fmtT(E.t)} / ${fmtT(E.steps.length*E.hold)}</div>
      <button className="btn warn full" style=${{marginTop:16}} onClick=${()=>finishEval(true)}><${Icon} n="x" s=${16}/>Stop and score so far</button></div>`})()}
    ${res&&html`<div className="enter">
      <div className="card" style=${{textAlign:'center'}}><div className="lbl">Accuracy${res.stopped?' (partial run)':''}</div><div className="num" style=${{fontSize:48,fontWeight:600,lineHeight:1.1}}>${pct(res.acc)}</div>
        <div className="tiny">${res.n} scored samples at 10 Hz · macro F1 ${res.macroF==null?'–':res.macroF.toFixed(2)} · ${SRC[res.src]?SRC[res.src].data:res.src}${res.calibrated?'':' · not calibrated'}</div></div>
      <div className="card"><div className="h2" style=${{marginBottom:8}}>Confusion matrix</div><div className="tiny" style=${{marginBottom:6}}>Rows: true posture · columns: predicted</div>
        <div style=${{display:'grid',gridTemplateColumns:'64px repeat(6,minmax(0,1fr))',gap:3,fontSize:11}}>
          <span></span>${PKEYS.map(k=>html`<span key=${'h'+k} style=${{textAlign:'center',color:POSTURES[k].color}}>${SHORT[k]}</span>`)}
          ${PKEYS.map(a=>{const rowN=PKEYS.reduce((x,b)=>x+res.M[a][b],0);return html`<${React.Fragment} key=${a}><span style=${{color:POSTURES[a].color,alignSelf:'center'}}>${SHORT[a]}</span>
            ${PKEYS.map(b=>{const v=res.M[a][b],f=rowN?v/rowN:0;return html`<span key=${b} className="mono" style=${{textAlign:'center',padding:'7px 0',borderRadius:6,background:a===b?`rgba(60,242,180,${.12+f*.6})`:`rgba(255,107,122,${f*.7})`,color:f>.5?'#03221C':'var(--ink)'}}>${v}</span>`})}<//>`})}</div></div>
      <div className="card"><div className="h2" style=${{marginBottom:6}}>Per-class metrics</div>
        <table><thead><tr><th>Posture</th><th className="r">P</th><th className="r">R</th><th className="r">F1</th><th className="r">Latency</th></tr></thead><tbody>
        ${res.per.map(x=>html`<tr key=${x.k}><td>${POSTURES[x.k].label}</td><td className="r">${pct(x.P)}</td><td className="r">${pct(x.R)}</td><td className="r">${x.F==null?'–':x.F.toFixed(2)}</td><td className="r">${x.lat==null?'–':x.lat.toFixed(1)+' s'}${x.miss?html`<span className="tiny"> (${x.miss} missed)</span>`:''}</td></tr>`)}</tbody></table>
        <div className="tiny" style=${{marginTop:8}}>Latency = median time from prompt to first matching prediction (includes the human transition, filter and 0.4 s debounce).</div></div>
      <div className="row" style=${{gap:8,flexWrap:'wrap'}}>
        <button className="btn sm" onClick=${()=>exportCSV(`aligna-eval-metrics-${stamp()}.csv`,evalRows(res))}><${Icon} n="save" s=${16}/>Metrics CSV</button>
        <button className="btn sm" onClick=${()=>exportCSV(`aligna-eval-samples-${stamp()}.csv`,[['t_s','true_label','predicted','transition','tilt_deg','lateral_deg','gyro_dps'],...res.rows])}><${Icon} n="save" s=${16}/>Samples CSV</button>
        <button className="btn sm" onClick=${()=>{S.ev=null}}><${Icon} n="reset" s=${16}/>New run</button>
        <button className="btn sm pri" onClick=${close}>Done</button></div></div>`}
  </div></div>`}

function Profile({back,replay}){

        <div className="tiny" style=${{marginTop:6}}>Slouch > ${SENS[st.sensitivity].slouch}° · lean > ±${SENS[st.sensitivity].lean}° · bend > ${SENS[st.sensitivity].bend}°</div></div>
      <${Sl} k="alertDelay" label="Slouch detection duration" min=${5} max=${60} step=${5} u=" s"/><${Sl} k="vibIntensity" label="Vibration intensity" min=${10} max=${100} step=${5} u="%"/></div>
    <div className="card"><div className="h2">Notifications</div><${Tog} k="banners" label="In-app alert banners" sub="Show a banner when a nudge fires"/><${Tog} k="dailySummary" label="Daily summary" sub="Evening recap of posture time"/><${Tog} k="weekly" label="Weekly report" sub="Trend digest every Monday"/></div>
    <div className="card"><div className="h2">Preferences</div><div className="setrow"><div style=${{fontSize:14,marginBottom:8}}>Angle units</div><div className="seg">${[['deg','Degrees'],['rad','Radians']].map(([k,n])=>html`<button key=${k} className=${st.units===k?'on':''} onClick=${()=>set('units',k)}>${n}</button>`)}</div></div>
      <div className="setrow row" style=${{gap:8}}><button className="btn sm" style=${{flex:1}} onClick=${replay}>Replay onboarding</button><button className="btn sm warn" style=${{flex:1}} onClick=${()=>{S.saved=[];store.set('saved',[]);S.calib={done:false,p:0,r:0,at:null};store.set('calib',S.calib);S.sess=newSession();toast('Demo data and calibration cleared','#8EB2AF','reset')}}>Reset demo data</button></div></div>
    <p className="tiny" style=${{textAlign:'center',padding:'0 10px'}}>ALIGNA is a proof-of-concept for DH803 (PostureSense). The alignment score is an app-defined metric from IMU tilt angles. It is not a medical measurement or diagnosis.</p>
  </div>`}

/* ---------------- ONBOARDING ---------------- */
function Onboarding({done}){const[i,setI]=useState(0);
  const pages=[
    {t:'Your posture. Your balance. Your wellbeing.',s:'ALIGNA pairs with the PostureSense wearable to show how you sit and stand, as it happens.',pic:html`<div style=${{display:'grid',placeItems:'center',gap:16}}><${Logo} s=${112}/><b style=${{letterSpacing:'.3em',fontSize:26}}>ALIGNA</b></div>`},
    {t:'A sensor on your upper back',s:'An iPhone strapped between your shoulder blades senses tilt and rotation with its built-in accelerometer and gyroscope. ALIGNA estimates your trunk angles from it.',pic:html`<div style=${{width:240,margin:'0 auto'}}><${SideFigure} P=${0} color="#3CF2B4" haptic=${true} uid="o1"/></div>`},
    {t:'A gentle nudge when you slouch',s:'Hold a poor posture too long and the iPhone on your back plays a chime and says "Straighten up". You choose how long to wait.',pic:html`<div style=${{width:240,margin:'0 auto'}}><${SideFigure} P=${22} color="#FFB547" haptic=${true} uid="o2"/></div>`},
    {t:'Calibrate your neutral',s:'Sit tall for five seconds so ALIGNA learns your upright position and the sensor’s mounting angle.',pic:html`<div style=${{display:'grid',placeItems:'center'}}><${Puck} buzz=${false} color="#3CF2B4"/></div>`}];
  const p=pages[i];
  return html`<div className="overlay" style=${{background:'radial-gradient(500px 400px at 50% 25%,#0F3A3A,transparent 70%),var(--bg)'}}>
    <div className="row between" style=${{padding:'14px 20px 0'}}><span className="tiny">${i+1} / ${pages.length}</span><button className="btn sm" style=${{background:'none',border:0}} onClick=${()=>done(false)}>Skip</button></div>
    <div key=${i} className="enter" style=${{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 28px'}}>
      <div style=${{minHeight:290,display:'grid',placeItems:'center'}}>${p.pic}</div>
      <h2 className="h1" style=${{fontSize:28,textWrap:'balance',marginTop:10}}>${p.t}</h2><p className="sub" style=${{fontSize:15.5,color:'var(--ink)',opacity:.8}}>${p.s}</p></div>
    <div style=${{padding:'0 24px 34px'}}><div className="dots" style=${{marginBottom:18}}>${pages.map((_,j)=>html`<i key=${j} className=${j===i?'on':''}></i>`)}</div>
      ${i<pages.length-1?html`<button className="btn pri full" onClick=${()=>setI(i+1)}>Continue</button>`:html`<div className="row" style=${{gap:8}}><button className="btn" style=${{flex:1}} onClick=${()=>done(false)}>Later</button><button className="btn pri" style=${{flex:1.4}} onClick=${()=>done(true)}>Calibrate now</button></div>`}</div></div>`}

/* ---------------- DEMO SHEET ---------------- */
const DEMO_OPTS=[['auto','Auto','#3CF2B4'],...PKEYS.map(k=>[k,POSTURES[k].label,POSTURES[k].color])];
function DemoSheet({close}){useTick();const sim_=S.link.kind==='simulated';
  return html`<${React.Fragment}><div className="sheetBg" onClick=${close}></div><div className="sheet" role="dialog" aria-label="Demo controls">
    <div className="grab"></div><div className="row between"><b style=${{fontSize:17}}>Demo controls</b><button className="iconbtn" onClick=${close} aria-label="Close"><${Icon} n="x" s=${16}/></button></div>
    <p className="sub" style=${{margin:'4px 0 12px'}}>${sim_?'Drive the simulated wearer. Values change smoothly, like a real body.':'A real sensor source is active. Demo controls only drive the simulator; start the demo source on the Device tab to use them.'}</p>
    <div className="pgrid">${DEMO_OPTS.map(([k,n,c])=>html`<button key=${k} className=${'pbtn'+(sim.mode===k?' on':'')} style=${{color:sim.mode===k?c:'var(--ink)'}} disabled=${!sim_} onClick=${()=>{sim.setMode(k);toast(k==='auto'?'Auto demo: random realistic transitions':`Simulating: ${n}`,c,'flask')}}>
      <span style=${{width:26,height:26,borderRadius:9,background:c+'22',display:'grid',placeItems:'center'}}><i style=${{width:9,height:9,borderRadius:5,background:c}}></i></span>${n}</button>`)}</div>
    <button className="btn full" style=${{marginTop:12}} onClick=${()=>fireHaptic('manual trigger',true)}><${Icon} n="vib" s=${18}/>Trigger nudge</button></div><//>`}

/* ---------------- SIDE CONSOLE (desktop) ---------------- */
function Console({replay}){useTick();const L=S.live,on=S.link.status==='streaming',sim_=S.link.kind==='simulated',th=SENS[S.settings.sensitivity],P=POSTURES[L.cls];
  const nodes=[['IMU sample',`${S.link.kind==='simulated'?'Simulated 6-axis IMU':S.link.kind==='ble'?'MPU6050':'iPhone IMU'} · ax ay az · gx gy gz`,on?`${L.ay.toFixed(2)} g · ${L.gyroMag.toFixed(0)}°/s`:'–'],['Calibration','subtract saved neutral',S.calib.done?`−${S.calib.p.toFixed(1)}°`:'not set'],
    ['Filtering','complementary, α = 0.98',on?`${L.pAbs.toFixed(1)}° raw`:'–'],['Angle estimation','forward tilt · lateral tilt',on?`${L.p.toFixed(1)}° · ${L.r.toFixed(1)}°`:'–'],
    ['Classification',`threshold rules · ML slot (DT/SVM/RF)`,on?P.label:'–'],['Feedback',`nudge after ${S.settings.alertDelay} s`,on?(P.kind==='poor'?`${L.bad.toFixed(0)} / ${S.settings.alertDelay} s`:'idle'):'–']];
  const hot=!on?-1:P.kind==='poor'?5:4;
  return html`<aside className="side">
    <div className="brand"><${Logo} s=${60}/><div><h1>ALIGNA</h1><p className="tag">Your posture. Your balance. Your wellbeing.</p></div></div>
    <p style=${{color:'var(--mute)',maxWidth:520,margin:'18px 0 22px'}}>Companion app for <b style=${{color:'var(--ink)'}}>PostureSense</b>. The current prototype uses an iPhone worn on the upper back as the inertial sensor and this tablet as the display. It detects upright, slouch, left/right lean, forward bend and movement, and nudges the wearer with sound. DH803 Wearable Health Technology · IIT Bombay.</p>
    <div className="row between" style=${{marginBottom:10}}><b>Signal pipeline · live</b><span className="chip demoPill" style=${{height:26}}>${src().tag}</span></div>
    ${nodes.map(([a,b,v],i)=>html`<div key=${a} className=${'pn'+(i<=hot&&on?' hot':'')}><span className="ix">${i+1}</span><div><b>${a}</b><span>${b}</span></div><span className="vv" style=${{color:i===4&&on?P.color:undefined}}>${v}</span></div>`)}
    <div style=${{margin:'22px 0 10px'}}><b>Demo controls</b><span className="tiny"> · drive the simulated wearer</span></div>
    <div className="sideBtns">${DEMO_OPTS.map(([k,n,c])=>html`<button key=${k} className=${sim.mode===k?'on':''} disabled=${!sim_} onClick=${()=>{sim.setMode(k);toast(k==='auto'?'Auto demo: random realistic transitions':`Simulating: ${n}`,c,'flask')}}>${n}</button>`)}
      <button onClick=${()=>fireHaptic('manual trigger',true)}>Trigger nudge</button><button onClick=${replay}>Replay onboarding</button></div>
    <p className="tiny" style=${{marginTop:18,maxWidth:520}}>Thresholds (${S.settings.sensitivity}): slouch > ${th.slouch}°, lean > ±${th.lean}°, bend > ${th.bend}°, movement when gyro magnitude > 30 °/s. ${sim_?'All values on this page come from the in-app simulator until a real sensor is connected.':S.link.kind==='phone'?'Live values come from the iPhone motion sensors, not the PostureSense hardware.':'Live values come from the connected ESP32.'}</p>
  </aside>`}

/* ---------------- APP SHELL ---------------- */
const TABS=[['home','Home','home'],['live','Live','live'],['session','Session','sess'],['trends','Trends','trend'],['device','Device','dev']];
function Clock(){useTick();const d=new Date();return html`<span className="num">${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}</span>`}
function App(){
  useTick();const[tab,setTab]=useState(()=>{const h=location.hash.slice(1);return TABS.some(t=>t[0]===h)||h==='profile'?h:'home'});
  const[onb,setOnb]=useState(!S.onboarded);const[evOpen,setEvOpen]=useState(false);const[cal,setCal]=useState(false);const[demo,setDemo]=useState(false);const[shake,setShake]=useState(false);
  const[scale,setScale]=useState(1);const scr=useRef(null);
  useEffect(()=>{const f=()=>setScale(Math.min(1,(window.innerHeight-48)/844));f();window.addEventListener('resize',f);shakeFn=()=>{setShake(true);setTimeout(()=>setShake(false),520)};return()=>window.removeEventListener('resize',f)},[]);
  useEffect(()=>{const f=()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)||h==='profile')setTab(h)};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  const go=t=>{setTab(t);try{history.replaceState(null,'','#'+t)}catch(e){}if(scr.current)scr.current.scrollTop=0};
  const finishOnb=calNow=>{setOnb(false);S.onboarded=true;store.set('onboarded',true);if(calNow){go('device');setCal(true)}};
  const replay=()=>{setOnb(true)};
  const screen={home:html`<${Home} go=${go} openDemo=${()=>setDemo(true)} openCal=${()=>setCal(true)}/>`,live:html`<${Live}/>`,session:html`<${Session} openEval=${()=>setEvOpen(true)}/>`,trends:html`<${Trends}/>`,device:html`<${Device} openCal=${()=>setCal(true)}/>`,profile:html`<${Profile} back=${()=>go('home')} replay=${replay}/>`}[tab];
  return html`<div className="stage"><${Console} replay=${replay}/>
    <div className="phoneWrap" style=${{width:390*scale,height:844*scale}}>
      <div className=${'phone'+(shake?' shake':'')} style=${{transform:`scale(${scale})`}}>
        <div className="island"></div>
        <div className="statusbar"><${Clock}/><span className="row" style=${{gap:6}}><${Icon} n="wifi" s=${16} w=${2}/><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>
        <div className="screen" ref=${scr}><div key=${tab} className="enter">${screen}</div></div>
        ${Share.status!=='off'&&tab!=='device'&&html`<button className="chip" onClick=${()=>go('device')} style=${{position:'absolute',left:'50%',transform:'translateX(-50%)',bottom:92,zIndex:21,background:'#0E2A31',color:Share.status==='live'?'#3CF2B4':'#FFB547'}}><span className=${Share.status==='live'?'pulseDot':''} style=${{width:8,height:8,borderRadius:4,background:'currentColor',display:'inline-block'}}></span>${Share.status==='live'?'Sharing live':'Waiting for display'} · <span className="mono">${Share.code||''}</span></button>`}
        <nav className="nav">${TABS.map(([k,n,ic])=>html`<button key=${k} className=${tab===k?'on':''} onClick=${()=>go(k)} aria-label=${n}><${Icon} n=${ic} s=${22}/>${n}</button>`)}</nav>
        <div className="toasts">${S.toasts.map(t=>html`<div className="toast" key=${t.id}><span style=${{color:t.color,display:'grid'}}><${Icon} n=${t.icon} s=${18}/></span><span>${t.text}</span></div>`)}</div>
        ${demo&&html`<${DemoSheet} close=${()=>setDemo(false)}/>`}
        ${cal&&html`<${Calibration} close=${()=>setCal(false)}/>`}
        ${evOpen&&html`<${Evaluation} close=${()=>setEvOpen(false)}/>`}
        ${onb&&html`<${Onboarding} done=${finishOnb}/>`}
      </div></div></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
</body>
</html>
